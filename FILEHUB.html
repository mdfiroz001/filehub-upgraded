<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FileHub Admin Panel</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #e0e7ff;
            --primary-glow: rgba(79, 70, 229, 0.35);
            --secondary: #10b981;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border: #e2e8f0;
            --red: #ef4444;
            --green: #22c55e;
            --yellow: #f59e0b;
        }
        [data-theme="dark"] {
            --primary: #818cf8;
            --primary-light: #1e293b;
            --primary-glow: rgba(129, 140, 248, 0.35);
            --secondary: #34d399;
            --bg: #0f172a;
            --surface: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: #334155;
            --red: #dc2626;
            --green: #16a34a;
            --yellow: #d97706;
        }
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg); 
            color: var(--text-main); 
            min-height: 100vh; 
            transition: all 0.3s ease;
        }
        .sidebar {
            width: 280px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            padding: 20px;
            position: fixed;
            top: 0;
            left: -280px;
            height: 100vh;
            z-index: 1000;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 24px rgba(0,0,0,0.02);
        }
        .sidebar.open { left: 0; }
        @media (min-width: 768px) {
            .sidebar { left: 0; }
            .main-content { margin-left: 280px; }
        }
        .sidebar-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            z-index: 999;
            display: none;
        }
        .sidebar-overlay.active { display: block; }
        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-logo {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            object-fit: cover;
            border: 2px solid var(--primary);
            box-shadow: 0 4px 10px var(--primary-glow);
        }
        .sidebar-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.45rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 10px;
            color: var(--text-sub);
            font-weight: 600;
            font-size: 0.92rem;
            transition: all 0.2s ease;
            margin-bottom: 6px;
            cursor: pointer;
            text-decoration: none;
        }
        .nav-link:hover { 
            background: var(--primary-light); 
            color: var(--primary);
            transform: translateX(3px);
        }
        .nav-link.active { 
            background: var(--primary); 
            color: white; 
            box-shadow: 0 4px 14px var(--primary-glow);
        }
        .nav-link i { font-size: 1.15rem; width: 22px; text-align: center; }
        
        .main-content { flex-grow: 1; padding: 25px; }
        .card {
            background: var(--surface); 
            border-radius: 18px;
            padding: 24px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }
        .card-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.25rem; 
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .stat-card-pro {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
            position: relative;
            overflow: hidden;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .stat-card-pro:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.06);
        }
        .stat-card-pro::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 4px;
        }
        .stat-blue::after { background: #4f46e5; }
        .stat-emerald::after { background: #10b981; }
        .stat-amber::after { background: #f59e0b; }
        .stat-purple::after { background: #8b5cf6; }

        .stat-icon-wrap {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
        }

        .btn {
            padding: 9px 18px; border-radius: 10px;
            font-weight: 600; cursor: pointer;
            transition: 0.2s; border: none;
            font-size: 0.9rem;
            display: inline-flex; align-items: center; justify-content: center;
            gap: 8px;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { opacity: 0.92; box-shadow: 0 4px 12px var(--primary-glow); }
        .btn-danger { background: var(--red); color: white; }
        .btn-danger:hover { opacity: 0.92; }
        .btn-success { background: var(--green); color: white; }
        .btn-success:hover { opacity: 0.92; }
        .btn-warning { background: var(--yellow); color: white; }
        .btn-warning:hover { opacity: 0.92; }
        .btn-sm { padding: 6px 12px; font-size: 0.8rem; border-radius: 8px; }

        .form-group { margin-bottom: 18px; }
        .form-label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; }
        .form-input, .form-textarea, .form-select { 
            width: 100%; padding: 11px 14px;
            border: 1.5px solid var(--border); border-radius: 10px;
            background: var(--bg); color: var(--text-main);
            box-sizing: border-box; font-size: 0.95rem;
            transition: border-color 0.2s;
        }
        .form-input:focus, .form-textarea:focus, .form-select:focus {
            outline: none; border-color: var(--primary);
        }
        .status-badge {
            padding: 4px 12px; border-radius: 20px;
            font-size: 0.75rem; font-weight: 700; text-transform: capitalize;
            display: inline-flex; align-items: center; gap: 4px;
        }
        .status-active { background: #e0e7ff; color: #4f46e5; }
        .status-inactive { background: #fee2e2; color: #dc2626; }
        .status-approved { background: #dcfce7; color: #16a34a; }
        .status-pending { background: #fef3c7; color: #d97706; }
        .status-rejected { background: #fee2e2; color: #dc2626; }
        
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(5px);
            z-index: 2000; display: none;
            justify-content: center; align-items: center;
        }
        .modal-overlay.active { display: flex; animation: fadeIn 0.2s ease; }
        .modal-box {
            background: var(--surface); width: 92%; max-width: 620px;
            max-height: 90vh; overflow-y: auto;
            border-radius: 18px; padding: 26px;
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            border: 1px solid var(--border);
        }
        .modal-close {
            position: absolute; top: 18px; right: 18px;
            cursor: pointer; font-size: 1.3rem;
            color: var(--text-sub); transition: 0.2s;
        }
        .modal-close:hover { color: var(--red); }
        .alert { padding: 14px; border-radius: 10px; margin-bottom: 18px; font-weight: 500; font-size: 0.92rem; }
        .alert-success { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
        .alert-error { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
        .hidden { display: none !important; }

        .data-table { width: 100%; border-collapse: separate; border-spacing: 0; white-space: nowrap; }
        .data-table th { text-align: left; padding: 14px; background: var(--bg); color: var(--text-sub); font-weight: 700; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); }
        .data-table td { padding: 14px; border-bottom: 1px solid var(--border); font-size: 0.92rem; }
        .data-table tr:hover td { background: var(--bg); }
        
        .info-badge {
            background: rgba(79, 70, 229, 0.08); color: var(--primary);
            padding: 10px 16px; border-radius: 10px;
            font-size: 0.88rem; font-weight: 600;
            display: inline-flex; align-items: center; gap: 8px;
            margin-bottom: 20px; width: 100%;
            border-left: 4px solid var(--primary);
        }

        .slug-preview {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            font-family: monospace;
            font-size: 0.85rem;
            color: var(--primary);
            word-break: break-all;
            margin-top: 6px;
        }
        .slug-input-wrapper {
            display: flex; align-items: center; gap: 6px;
            background: var(--bg);
            border: 1.5px solid var(--border);
            border-radius: 10px;
            padding: 0 12px;
        }
        .slug-input-wrapper:focus-within { border-color: var(--primary); }
        .slug-input-wrapper .prefix {
            color: var(--text-sub); font-size: 0.88rem;
            white-space: nowrap; font-family: monospace;
        }
        .slug-input-wrapper input {
            border: none; background: transparent;
            padding: 11px 0; outline: none;
            width: 100%; color: var(--text-main);
            font-family: monospace; font-size: 0.9rem;
        }

        .prompt-thumb {
            width: 60px; height: 60px;
            object-fit: cover; border-radius: 10px;
            border: 1px solid var(--border);
        }
        .step-badge {
            background: var(--primary-light);
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center; gap: 4px;
        }
        .step-badge.step-zero { background: #dcfce7; color: #16a34a; }

        .social-input-row {
            display: flex; align-items: center; gap: 10px;
            background: var(--bg); border: 1.5px solid var(--border);
            border-radius: 10px; padding: 0 12px;
            margin-bottom: 12px;
        }
        .social-input-row .icon-box {
            width: 32px; height: 32px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 0.9rem; flex-shrink: 0;
        }
        .social-input-row .icon-box.telegram { background: #0088cc; }
        .social-input-row .icon-box.facebook { background: #1877f2; }
        .social-input-row .icon-box.youtube { background: #ff0000; }
        .social-input-row .icon-box.whatsapp { background: #25d366; }
        .social-input-row .icon-box.instagram { background: linear-gradient(45deg, #f09433, #dc2743, #bc1888); }
        .social-input-row .icon-box.twitter { background: #000000; }
        .social-input-row .icon-box.email { background: #ea4335; }
        .social-input-row input {
            flex: 1; border: none; background: transparent;
            padding: 12px 0; outline: none; color: var(--text-main);
            font-size: 0.9rem;
        }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    </style>
</head>
<body>

<div id="app">
    <!-- লগইন সেকশন -->
    <div id="login-section" class="min-h-screen flex items-center justify-center p-4">
        <div class="card max-w-md w-full" style="box-shadow: 0 20px 40px rgba(0,0,0,0.06);">
            <div class="text-center mb-6">
                <img id="login-logo-img" src="https://i.postimg.cc/VkCqsjD1/file-00000000fa18821191576f156d4e3bfe.png" 
                     onerror="this.onerror=null;this.src='https://i.postimg.cc/VkCqsjD1/file-00000000fa18821191576f156d4e3bfe.png';"
                     alt="FileHub" class="w-20 h-20 rounded-2xl mx-auto mb-4 object-cover shadow-md border-2 border-indigo-500">
                <h2 class="text-2xl font-bold font-['Outfit']">Admin Portal</h2>
                <p class="text-sm text-gray-500 mt-1">Sign in to control FileHub</p>
            </div>
            <div id="login-alert" class="alert hidden"></div>
            <form id="login-form">
                <div class="form-group">
                    <label class="form-label">Admin Email</label>
                    <input type="email" id="login-email" class="form-input" placeholder="admin@filehub.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="login-password" class="form-input" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary w-full justify-center" id="login-btn" style="width:100%; padding: 12px;">
                    <i class="fas fa-sign-in-alt mr-2"></i> Access Dashboard
                </button>
            </form>
        </div>
    </div>

    <!-- এডমিন প্যানেল -->
    <div id="admin-panel" class="hidden min-h-screen">
        <div id="sidebar-overlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <img id="sidebar-logo-img" src="https://i.postimg.cc/VkCqsjD1/file-00000000fa18821191576f156d4e3bfe.png" 
                     onerror="this.onerror=null;this.src='https://i.postimg.cc/VkCqsjD1/file-00000000fa18821191576f156d4e3bfe.png';"
                     alt="FileHub" class="sidebar-logo">
                <h1 class="sidebar-title" id="sidebar-brand-name">FileHub</h1>
                <button class="md:hidden ml-auto text-xl text-gray-500" onclick="toggleSidebar()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <nav style="flex:1;">
                <div class="nav-link active" data-page="dashboard" onclick="loadPage('dashboard')">
                    <i class="fas fa-chart-pie"></i> Dashboard
                </div>
                <div class="nav-link" data-page="files" onclick="loadPage('files')">
                    <i class="fas fa-folder-open"></i> Manage Files
                </div>
                <div class="nav-link" data-page="banners" onclick="loadPage('banners')">
                    <i class="fas fa-images"></i> Sliders / Banners
                </div>
                <div class="nav-link" data-page="ai-prompts" onclick="loadPage('ai-prompts')">
                    <i class="fas fa-wand-magic-sparkles"></i> AI Prompts
                </div>
                <div class="nav-link" data-page="admin-info" onclick="loadPage('admin-info')">
                    <i class="fas fa-user-shield"></i> Admin Info
                </div>
                <div class="nav-link" data-page="users" onclick="loadPage('users')">
                    <i class="fas fa-users"></i> Users Management
                </div>
                <div class="nav-link" data-page="notifications" onclick="loadPage('notifications')">
                    <i class="fas fa-bell"></i> Push Notice
                </div>
                <div class="nav-link" data-page="settings" onclick="loadPage('settings')">
                    <i class="fas fa-palette"></i> Site Customization
                </div>
                <div class="nav-link" data-page="ads" onclick="loadPage('ads')">
                    <i class="fas fa-rectangle-ad"></i> Ads & Script Slots
                </div>
                <div class="nav-link" data-page="ai-settings" onclick="loadPage('ai-settings')">
                    <i class="fas fa-robot"></i> AI Chat Assistant
                </div>
            </nav>
            <div style="margin-top:auto; padding-top:16px; border-top:1px solid var(--border);">
                <div class="nav-link text-red-500 hover:bg-red-50 hover:text-red-600" onclick="logout()">
                    <i class="fas fa-power-off"></i> Logout
                </div>
            </div>
        </aside>

        <main class="main-content">
            <div class="md:hidden flex items-center justify-between mb-6 pb-4 border-b border-gray-200">
                <button class="text-2xl text-gray-700" onclick="toggleSidebar()">
                    <i class="fas fa-bars"></i>
                </button>
                <h2 class="text-xl font-bold font-['Outfit']">FileHub Admin</h2>
                <div class="w-8"></div>
            </div>
            <div id="page-content" class="overflow-hidden"></div>
        </main>
    </div>
</div>

<div id="item-modal" class="modal-overlay">
    <div class="modal-box">
        <span class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></span>
        <h3 id="modal-title" class="card-title"></h3>
        <div id="modal-alert" class="alert hidden"></div>
        <form id="modal-form"></form>
    </div>
</div>

<div id="confirm-modal" class="modal-overlay">
    <div class="modal-box" style="max-width:400px; text-align: center;">
        <div class="w-16 h-16 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
            <i class="fas fa-exclamation-triangle"></i>
        </div>
        <h3 class="card-title justify-center mb-2">Are you sure?</h3>
        <p id="confirm-message" class="text-sm text-gray-500 mb-6"></p>
        <div class="flex justify-center gap-3">
            <button class="btn btn-sm bg-gray-200 text-gray-700 hover:bg-gray-300" onclick="closeConfirmModal()">Cancel</button>
            <button class="btn btn-sm btn-danger" id="confirm-action">Yes, Confirm</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAgblSHPL02TI8lyw5XBRJEi4y3lUOlqKQ",
        authDomain: "file-5dd84.firebaseapp.com",
        databaseURL: "https://file-5dd84-default-rtdb.firebaseio.com",
        projectId: "file-5dd84",
        storageBucket: "file-5dd84.firebasestorage.app",
        messagingSenderId: "425635065125",
        appId: "1:425635065125:web:a8ce55b1745f301bb5becc",
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const database = firebase.database();

    const usersRef = database.ref('users');
    const filesRef = database.ref('files');
    const bannersRef = database.ref('banners');
    const settingsRef = database.ref('settings');
    const notificationsRef = database.ref('notifications');
    const adminsRef = database.ref('admins');

    let currentUser = null;
    let isAdmin = false;
    let currentPage = 'dashboard';
    let allUsers = [];
    let allFiles = [];
    let allBanners = [];
    let appSettings = {};

    const DEFAULT_LOGO = "https://i.postimg.cc/VkCqsjD1/file-00000000fa18821191576f156d4e3bfe.png";

    function updateAdminBranding(logoUrl, name) {
        const targetLogo = logoUrl && logoUrl.trim() !== '' ? logoUrl : DEFAULT_LOGO;
        const brandName = name && name.trim() !== '' ? name : 'FileHub';
        
        const loginImg = document.getElementById('login-logo-img');
        if (loginImg) loginImg.src = targetLogo;

        const sidebarImg = document.getElementById('sidebar-logo-img');
        if (sidebarImg) sidebarImg.src = targetLogo;

        const brandText = document.getElementById('sidebar-brand-name');
        if (brandText) brandText.textContent = brandName;
    }

    auth.onAuthStateChanged(async (user) => {
        if (user) {
            try {
                const adminSnap = await adminsRef.child(user.uid).once('value');
                if (adminSnap.exists()) {
                    currentUser = user;
                    isAdmin = true;
                    showAdminPanel();
                    await loadData();
                } else {
                    auth.signOut();
                    showLogin();
                    showAlert('login-alert', 'You are not authorized as admin.', 'error');
                }
            } catch (error) {
                auth.signOut();
                showLogin();
                showAlert('login-alert', 'Authentication error: ' + error.message, 'error');
            }
        } else {
            showLogin();
            settingsRef.child('app').once('value').then(snap => {
                const s = snap.val() || {};
                updateAdminBranding(s.logoUrl, s.appName);
            }).catch(() => {});
        }
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;
        const loginBtn = document.getElementById('login-btn');
        loginBtn.disabled = true;
        loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Logging in...';
        try {
            await auth.signInWithEmailAndPassword(email, password);
        } catch (error) {
            showAlert('login-alert', error.message, 'error');
            loginBtn.disabled = false;
            loginBtn.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i> Access Dashboard';
        }
    });

    function showLogin() {
        document.getElementById('login-section').classList.remove('hidden');
        document.getElementById('admin-panel').classList.add('hidden');
    }
    function showAdminPanel() {
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('admin-panel').classList.remove('hidden');
    }
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('sidebar-overlay').classList.toggle('active');
    }

    async function loadData() {
        try {
            const usersSnap = await usersRef.once('value');
            allUsers = usersSnap.val() ? Object.entries(usersSnap.val()).map(function(e) { return Object.assign({ id: e[0] }, e[1]); }) : [];
            const filesSnap = await filesRef.once('value');
            allFiles = filesSnap.val() ? Object.entries(filesSnap.val()).map(function(e) { return Object.assign({ id: e[0] }, e[1]); }).sort(function(a, b) { return (b.created_at || 0) - (a.created_at || 0); }) : [];
            const bannersSnap = await bannersRef.once('value');
            allBanners = bannersSnap.val() ? Object.entries(bannersSnap.val()).map(function(e) { return Object.assign({ id: e[0] }, e[1]); }).sort(function(a, b) { return (b.created_at || 0) - (a.created_at || 0); }) : [];
            const settingsSnap = await settingsRef.once('value');

        });
        if (window.innerWidth < 768) {

    function esc(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    // ==================== SLUG SYSTEM ====================
    function generateSlugFromTitle(title) {
        if (!title) return '';
        return title.toLowerCase().trim()
            .replace(/[\u0980-\u09FF]/g, '')
            .replace(/[^a-z0-9\s-]/g, '')
            .replace(/\s+/g, '-')
            .replace(/-+/g, '-')
            .replace(/^-+|-+$/g, '')
            .substring(0, 60);
    }
    window.autoGenerateSlug = function() {
        const titleInput = document.getElementById('file-title');
        const slugInput = document.getElementById('file-slug');
        if (!titleInput || !slugInput) return;
        if (slugInput.dataset.userEdited === 'true') return;
        slugInput.value = generateSlugFromTitle(titleInput.value);
        updateSlugPreview();
    };
    window.sanitizeSlugInput = function() {
        const slugInput = document.getElementById('file-slug');
        if (!slugInput) return;
        const cleaned = slugInput.value.toLowerCase()
            .replace(/[\u0980-\u09FF]/g, '')
            .replace(/[^a-z0-9\s-]/g, '')
            .replace(/\s+/g, '-')
            .replace(/-+/g, '-');
        slugInput.value = cleaned;
        slugInput.dataset.userEdited = 'true';
        updateSlugPreview();
    };
    window.updateSlugPreview = function() {
        const slugInput = document.getElementById('file-slug');
        const previewEl = document.getElementById('slug-preview');
        if (!slugInput || !previewEl) return;
        const slug = slugInput.value.trim() || 'auto-generated';
        previewEl.textContent = window.location.origin + '/file/' + slug;
    };
    async function getUniqueSlug(baseSlug, excludeFileId) {
        let slug = baseSlug;
        let counter = 1;
        while (counter <= 20) {
            const snapshot = await filesRef.child(slug).once('value');
            if (!snapshot.exists() || snapshot.key === excludeFileId) return slug;
            counter++;
            slug = baseSlug + '-' + counter;
        }
        return baseSlug + '-' + Date.now().toString().slice(-5);
    }

                        '<input id="adsterra-direct-link" type="url" class="form-input font-mono text-sm" value="' + esc(ads.adsterraDirectLink || '') + '" required>' +

                    '<div class="form-group"><label class="form-label">Header Banner Script</label><textarea id="ads-header-code" class="form-textarea font-mono text-sm" rows="4">' + esc(ads.headerCode || '') + '</textarea></div>' +
                    '<div class="form-group"><label class="form-label">Footer Banner Script</label><textarea id="ads-footer-code" class="form-textarea font-mono text-sm" rows="4">' + esc(ads.footerCode || '') + '</textarea></div>' +
                    '<button class="btn btn-primary" type="submit">Save Ad Settings</button>' +
                '</form>' +
            '</div>';
        document.getElementById('ads-settings-form').onsubmit = async function(e) {
            e.preventDefault();
            await settingsRef.child('ads').update({
                adsterraDirectLink: document.getElementById('adsterra-direct-link').value.trim(),
                headerCode: document.getElementById('ads-header-code').value,
                footerCode: document.getElementById('ads-footer-code').value
            });
            alert('Ads settings saved!'); await loadData();
        };
    }

    // ==================== AI SETTINGS ====================
    function renderAISettings() {
        const aiKey = appSettings.aiApiKey || (appSettings.ai ? (appSettings.ai.apiKey || '') : '');
        const apiUrl = appSettings.ai ? (appSettings.ai.apiURL || 'https://api.openai.com/v1/chat/completions') : 'https://api.openai.com/v1/chat/completions';
        const aiModel = appSettings.ai ? (appSettings.ai.model || 'gpt-4o-mini') : 'gpt-4o-mini';

        document.getElementById('page-content').innerHTML = 
            '<h1 class="text-3xl font-bold font-[\'Outfit\'] mb-6">AI Chat Settings</h1>' +
            '<div class="card"><form id="ai-settings-form">' +
                '<div class="form-group"><label class="form-label">API Key</label><input type="password" id="ai-api-key" class="form-input font-mono" value="' + esc(aiKey) + '" required></div>' +
                '<div class="form-group"><label class="form-label">API URL</label><input type="url" id="ai-api-url" class="form-input font-mono" value="' + esc(apiUrl) + '" required></div>' +
                '<div class="form-group"><label class="form-label">Model</label><input type="text" id="ai-model" class="form-input" value="' + esc(aiModel) + '"></div>' +
                '<button type="submit" class="btn btn-primary">Save AI Settings</button>' +
            '</form></div>';

        document.getElementById('ai-settings-form').onsubmit = async function(e) {
            e.preventDefault();
            const k = document.getElementById('ai-api-key').value.trim();
            await settingsRef.child('ai').update({
                apiURL: document.getElementById('ai-api-url').value.trim(),
                apiKey: k,
                model: document.getElementById('ai-model').value.trim() || 'gpt-4o-mini'
            });
            await settingsRef.child('aiApiKey').set(k);
            alert('AI Config saved!'); await loadData();
        };
    }

    // ==================== ADMIN INFO ====================
    function renderAdminInfo() {
        const adminSettings = appSettings.admin || {};
        const adminName = adminSettings.name || 'FILE HUB এডমিন';
        const social = adminSettings.social || {};

        document.getElementById('page-content').innerHTML = 
            '<h1 class="text-3xl font-bold font-[\'Outfit\'] mb-6">Admin Contact Info</h1>' +
            '<div class="card"><form id="admin-info-form">' +
                '<div class="form-group"><label class="form-label">Admin Name</label><input type="text" id="admin-name" class="form-input" value="' + esc(adminName) + '" required></div>' +
                '<div class="form-group"><label class="form-label">Telegram URL</label><input type="url" id="social-telegram" class="form-input" value="' + esc(social.telegram || '') + '"></div>' +
                '<div class="form-group"><label class="form-label">Facebook URL</label><input type="url" id="social-facebook" class="form-input" value="' + esc(social.facebook || '') + '"></div>' +
                '<div class="form-group"><label class="form-label">YouTube URL</label><input type="url" id="social-youtube" class="form-input" value="' + esc(social.youtube || '') + '"></div>' +
                '<button type="submit" class="btn btn-primary">Save Info</button>' +
            '</form></div>';

        document.getElementById('admin-info-form').onsubmit = async function(e) {
            e.preventDefault();
            await settingsRef.child('admin').update({
                name: document.getElementById('admin-name').value.trim() || 'Admin',
                social: {
                    telegram: document.getElementById('social-telegram').value.trim(),
                    facebook: document.getElementById('social-facebook').value.trim(),
                    youtube: document.getElementById('social-youtube').value.trim()
                }
            });
            alert('Admin Info saved!'); await loadData();
        };
    }

    // ==================== USERS ====================
    function renderUsers() {
        let rows = '';
        allUsers.forEach(function(u) {
            rows += '<tr>' +
                '<td>' + (u.numericId || u.id.substring(0,8)) + '</td>' +
                '<td class="font-medium">' + esc(u.username || 'Anonymous') + '</td>' +
                '<td>' + esc(u.email || 'N/A') + '</td>' +
                '<td><span class="status-badge ' + (u.isAccountActive !== false ? 'status-active' : 'status-inactive') + '">' + (u.isAccountActive !== false ? 'Active' : 'Banned') + '</span></td>' +
                '<td><button class="btn btn-sm ' + (u.isAccountActive !== false ? 'btn-danger' : 'btn-success') + '" onclick="toggleUserBan(\'' + u.id + '\', ' + (u.isAccountActive !== false) + ')">' + (u.isAccountActive !== false ? 'Ban' : 'Unban') + '</button></td>' +
            '</tr>';
        });

        document.getElementById('page-content').innerHTML = 
            '<h1 class="text-3xl font-bold font-[\'Outfit\'] mb-6">Users Management</h1>' +
            '<div class="card overflow-x-auto"><table class="data-table w-full"><thead><tr><th>ID</th><th>Username</th><th>Email</th><th>Status</th><th>Actions</th></tr></thead>' +
            '<tbody>' + (rows || '<tr><td colspan="5" class="text-center py-6">No users found</td></tr>') + '</tbody></table></div>';
    }

    async function toggleUserBan(userId, currentStatus) {
        if (!confirm('Change account status?')) return;
        await usersRef.child(userId).update({ isAccountActive: !currentStatus });
        await loadData();
    }

    // ==================== NOTIFICATIONS ====================
    function renderNotifications() {
        document.getElementById('page-content').innerHTML = 
            '<h1 class="text-3xl font-bold font-[\'Outfit\'] mb-6">Push Notice</h1>' +
            '<div class="card"><form id="notif-form">' +
                '<div class="form-group"><label class="form-label">Notice Title</label><input type="text" id="notif-title" class="form-input" required></div>' +
                '<div class="form-group"><label class="form-label">Notice Details (Markdown)</label><textarea id="notif-desc" class="form-textarea" rows="4" required></textarea></div>' +
                '<button type="submit" class="btn btn-primary">Broadcast Notice</button>' +
            '</form></div>';

        document.getElementById('notif-form').onsubmit = async function(e) {
            e.preventDefault();
            await notificationsRef.push({
                title: document.getElementById('notif-title').value,
                decs: document.getElementById('notif-desc').value,
                created_at: Date.now(),
                is_read: false,
                target_uid: 'all'
            });
            alert('Notice sent!');
            document.getElementById('notif-form').reset();
        };
    }

    // ==================== FILE MODALS ====================
    function openFileForm(fileId) {
        const file = fileId ? allFiles.find(f => f.id === fileId) : {};
        document.getElementById('modal-title').textContent = fileId ? 'Edit File' : 'Upload File';
        
        document.getElementById('modal-form').innerHTML = 
            '<div class="form-group"><label class="form-label">Title</label><input id="file-title" class="form-input" value="' + esc(file.title || '') + '" required></div>' +
            '<div class="form-group"><label class="form-label">Custom Slug (Optional)</label><input id="file-slug" class="form-input" value="' + esc(file.id && !file.id.startsWith('-') ? file.id : '') + '"></div>' +
            '<div class="form-group"><label class="form-label">Description</label><textarea id="file-description" class="form-textarea" rows="4" required>' + esc(file.description || '') + '</textarea></div>' +
            '<div class="form-group"><label class="form-label">Thumbnail URL</label><input id="file-thumbnail" class="form-input" value="' + esc(file.thumbnail_url || '') + '" required></div>' +
            '<div class="form-group"><label class="form-label">Download URL</label><input id="file-download-url" class="form-input" value="' + esc(file.download_url || '') + '" required></div>' +
            '<div class="grid grid-cols-2 gap-4">' +
                '<div class="form-group"><label class="form-label">Extension</label><input id="file-extension" class="form-input" value="' + esc(file.file_extension || '.apk') + '" required></div>' +
                '<div class="form-group"><label class="form-label">Required Ads</label><input type="number" id="file-required-ads" class="form-input" value="' + (file.required_ads || 0) + '"></div>' +
            '</div>' +
            '<button type="submit" class="btn btn-primary w-full">Save File</button>';

        document.getElementById('modal-form').onsubmit = async function(e) {
            e.preventDefault();
            const title = document.getElementById('file-title').value.trim();
            const slug = document.getElementById('file-slug').value.trim() || generateSlugFromTitle(title) || 'file-' + Date.now();
            const data = {
                title: title,
                description: document.getElementById('file-description').value,
                thumbnail_url: document.getElementById('file-thumbnail').value,
                download_url: document.getElementById('file-download-url').value,
                file_extension: document.getElementById('file-extension').value,
                required_ads: parseInt(document.getElementById('file-required-ads').value) || 0,
                status: 'approved',
                created_at: file.created_at || Date.now(),
                total_downloads: file.total_downloads || 0
            };
            if (fileId && fileId !== slug) await filesRef.child(fileId).remove();
            await filesRef.child(slug).set(data);
            closeModal(); await loadData();
        };
        openModal();
    }

    function editFile(id) { openFileForm(id); }
    async function deleteFile(id) {
        if (!confirm('Delete file?')) return;
        await filesRef.child(id).remove(); await loadData();
    }

    // ==================== BANNER MODALS ====================
    function openBannerForm(bannerId) {
        const b = bannerId ? allBanners.find(x => x.id === bannerId) : {};
        document.getElementById('modal-title').textContent = bannerId ? 'Edit Banner' : 'Add Banner';
        document.getElementById('modal-form').innerHTML = 
            '<div class="form-group"><label class="form-label">Title</label><input id="banner-title" class="form-input" value="' + esc(b.title || '') + '" required></div>' +
            '<div class="form-group"><label class="form-label">Image URL</label><input id="banner-thumb" class="form-input" value="' + esc(b.thumbnail_url || '') + '" required></div>' +
            '<div class="form-group"><label class="form-label">Target Link (Optional)</label><input id="banner-link" class="form-input" value="' + esc(b.download_url || '') + '"></div>' +
            '<button type="submit" class="btn btn-primary w-full">Save Slider</button>';

        document.getElementById('modal-form').onsubmit = async function(e) {
            e.preventDefault();
            const d = {
                title: document.getElementById('banner-title').value,
                thumbnail_url: document.getElementById('banner-thumb').value,
                download_url: document.getElementById('banner-link').value,
                created_at: b.created_at || Date.now()
            };
            if (bannerId) await bannersRef.child(bannerId).update(d);
            else await bannersRef.push(d);
            closeModal(); await loadData();
        };
        openModal();
    }
    function editBanner(id) { openBannerForm(id); }
    async function deleteBanner(id) {
        if (!confirm('Delete slider?')) return;
        await bannersRef.child(id).remove(); await loadData();
    }

    // ==================== PROMPT MODALS ====================
    function openPromptForm(index) {
        const prompts = (appSettings.aiImage && appSettings.aiImage.prompts) || [];
        const p = (index !== null && index !== undefined) ? prompts[index] : {};
        document.getElementById('modal-title').textContent = index !== null && index !== undefined ? 'Edit Prompt' : 'Add Prompt';

        document.getElementById('modal-form').innerHTML = 
            '<div class="form-group"><label class="form-label">Title</label><input id="prompt-title" class="form-input" value="' + esc(p.title || '') + '" required></div>' +
            '<div class="form-group"><label class="form-label">Prompt</label><textarea id="prompt-text" class="form-textarea" rows="4" required>' + esc(p.prompt || '') + '</textarea></div>' +
            '<div class="form-group"><label class="form-label">Sample Image URL</label><input id="prompt-sample" class="form-input" value="' + esc(p.sample_image || '') + '"></div>' +
            '<div class="form-group"><label class="form-label">Required Ads Steps</label><input type="number" id="prompt-ads" class="form-input" value="' + (p.required_ads || 0) + '"></div>' +
            '<button type="submit" class="btn btn-primary w-full">Save Prompt</button>';

        document.getElementById('modal-form').onsubmit = async function(e) {
            e.preventDefault();
            let arr = prompts.slice();
            const obj = {
                title: document.getElementById('prompt-title').value,
                prompt: document.getElementById('prompt-text').value,
                sample_image: document.getElementById('prompt-sample').value,
                required_ads: parseInt(document.getElementById('prompt-ads').value) || 0,
                created_at: p.created_at || Date.now()
            };
            if (index !== null && index !== undefined) arr[index] = obj;
            else arr.push(obj);

            await settingsRef.child('aiImage').child('prompts').set(arr);
            closeModal(); await loadData();
        };
        openModal();
    }

    function copyPromptAdmin(i) {
        const p = appSettings.aiImage.prompts[i];
        navigator.clipboard.writeText(p.prompt).then(() => alert('Copied!'));
    }
    async function deletePrompt(i) {
        if (!confirm('Delete prompt?')) return;
        let arr = appSettings.aiImage.prompts.slice();
        arr.splice(i, 1);
        await settingsRef.child('aiImage').child('prompts').set(arr);
        await loadData();
    }

    // গ্লোবাল ফাংশন
    window.toggleSidebar = toggleSidebar;
    window.loadPage = loadPage;
    window.logout = logout;
    window.openModal = openModal;
    window.closeModal = closeModal;
    window.openFileForm = openFileForm;
    window.editFile = editFile;
    window.deleteFile = deleteFile;
    window.updateFileStatus = updateFileStatus;
    window.openBannerForm = openBannerForm;
    window.editBanner = editBanner;
    window.deleteBanner = deleteBanner;
    window.toggleUserBan = toggleUserBan;
    window.openPromptForm = openPromptForm;
    window.deletePrompt = deletePrompt;
    window.copyPromptAdmin = copyPromptAdmin;
</script>

</body>
</html>
